<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%2232%22 height=%2232%22><text y=%2226%22 font-size=%2228%22>🍓</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strawberry Lemonade - To Do List</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Left Navigation Rail / Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-profile">
        <div class="avatar-container">
          <svg viewBox="0 0 100 100" class="avatar-image">
            <rect width="100" height="100" fill="#FFCCD5" />
            <circle cx="50" cy="50" r="38" fill="#FFF0F2" />
            <path d="M25 45 C15 35, 10 65, 30 75 C35 78, 65 78, 70 75 C90 65, 85 35, 75 45 C75 25, 25 25, 25 45" fill="#DA5576" />
            <circle cx="50" cy="52" r="24" fill="#FCE0D6" />
            <circle cx="36" cy="56" r="4" fill="#FF9EAF" opacity="0.6" />
            <circle cx="64" cy="56" r="4" fill="#FF9EAF" opacity="0.6" />
            <circle cx="42" cy="50" r="2.5" fill="#3D2D3B" />
            <circle cx="58" cy="50" r="2.5" fill="#3D2D3B" />
            <path d="M46 59 Q50 63 54 59" stroke="#3D2D3B" stroke-width="2.5" stroke-linecap="round" fill="none" />
            <circle cx="28" cy="33" r="5" fill="#FEE066" />
            <circle cx="28" cy="33" r="1.5" fill="#DA5576" />
            <path d="M30 76 Q50 68 70 76 L75 92 L25 92 Z" fill="#FF8EA5" />
          </svg>
        </div>
        <h2 class="sidebar-greeting">Hi, Sunshine!</h2>
        <span class="sidebar-sub">Stay sweet today</span>
      </div>

      <nav class="sidebar-nav">
        <a href="./index.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
          </svg>
          <span>Dashboard</span>
        </a>
        <a href="./habits.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m11.314 11.314l.707.707" stroke-linecap="round" />
            <path d="M12 8a4 4 0 100 8 4 4 0 000-8z" />
          </svg>
          <span>Habits</span>
        </a>
        <a href="./tasks.html" class="nav-item active-progress">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <polyline points="9 11 12 14 22 4" />
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
          </svg>
          <span>Tasks</span>
        </a>
        <a href="./progress.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
            <path d="M4 22h16" />
            <path d="M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34" />
            <path d="M12 2a6 6 0 0 1 6 6v4a6 6 0 0 1-6 6 6 6 0 0 1-6-6V8a6 6 0 0 1 6-6z" />
          </svg>
          <span>Progress</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="btn-new-task crimson" id="sidebarNewTaskBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          <span>New Task</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="top-bar">
        <a href="./index.html" class="logo-text">Strawberry Lemonade</a>
        <div class="header-icons">
          <button class="icon-button" aria-label="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
          </button>
          <button class="icon-button" aria-label="Notifications Setting" style="padding: 0;">
             <div style="width: 32px; height: 32px; border-radius: 50%; overflow: hidden; border: 1.5px solid var(--accent-pink);">
               <svg viewBox="0 0 100 100" style="width: 100%; height: 100%; object-fit: cover;">
                 <rect width="100" height="100" fill="#FFE5EB" />
                 <circle cx="50" cy="50" r="30" fill="#FF8EA5" />
                 <path d="M25 85 Q50 65 75 85" fill="#9C3353" />
               </svg>
             </div>
          </button>
        </div>
      </header>

      <div class="task-header">
        <h1 class="dashboard-title">Squeeze the Day! 🍋</h1>
      </div>

      <!-- Completed today progress slider bar -->
      <section class="progress-today-card">
        <div class="progress-today-label">
          <span>Completed Today</span>
          <span class="percent-display" id="tasksPercentageText">40%</span>
        </div>
        <div class="progress-bar-outer">
          <div class="progress-bar-inner" id="tasksProgressBarInner">
            <!-- Star icon at progress boundary -->
            <svg class="progress-bar-star" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
            </svg>
          </div>
        </div>
      </section>

      <!-- Category Filter Pills -->
      <div class="filter-container">
        <button class="filter-btn active" data-filter="all">All Squeezes</button>
        <button class="filter-btn" data-filter="work">Main Squeeze (Work)</button>
        <button class="filter-btn" data-filter="personal">Zesty Life (Personal)</button>
        <button class="filter-btn" data-filter="fun">Sweet Treats (Fun)</button>
        <button class="filter-btn" data-filter="errands">Errands</button>
        <button class="filter-btn" data-filter="health">Health & Body</button>
      </div>

      <!-- Tasks Page Split Grid -->
      <div class="tasks-grid">
        <!-- Checklist column -->
        <section class="tasks-list-panel">
          <div class="task-list" id="allTasksContainer">
            <!-- Dynamic interactive task rows go here -->
          </div>
        </section>

        <!-- Right Side Panel -->
        <aside class="tasks-side-panel">
          <!-- Lemon-Strawberry Quote card -->
          <div class="lemon-quote-card">
            <span class="lemon-quote-date" id="tasksQuoteDate">TODAY</span>
            <p class="lemon-quote-content">"When life gives you lemons, add strawberries!" 🍓</p>
            
            <!-- Avatar stack -->
            <div class="avatar-stack">
              <div class="avatar-stack-item">
                <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#DA5576"/></svg>
              </div>
              <div class="avatar-stack-item">
                <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#FF8EA5"/></svg>
              </div>
              <div class="avatar-stack-item">
                <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#FEF08A"/></svg>
              </div>
              <div class="avatar-stack-item avatar-stack-plus">
                <span>+3</span>
              </div>
            </div>
          </div>

          <!-- Quick Squeeze Mini Form -->
          <div class="quick-squeeze-card">
            <h3 class="quick-title">Quick Squeeze</h3>
            <form class="quick-form" id="quickSqueezeForm">
              <input type="text" class="quick-input" id="quickTaskText" placeholder="Add a new task..." required />
              <div class="quick-row">
                <select class="quick-select" id="quickTaskCategory">
                  <option value="work">Main Squeeze</option>
                  <option value="personal">Zesty Life</option>
                  <option value="fun">Sweet Treats</option>
                  <option value="errands">Errands</option>
                  <option value="health">Health</option>
                </select>
                <button type="submit" class="quick-add-btn" aria-label="Add project task">+</button>
              </div>
            </form>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <!-- New Task Modal Overlay (Re-used for Sidebar consistency) -->
  <div class="modal-overlay" id="newTaskModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Squeeze in a New Task!</h2>
        <button class="modal-close-btn" id="modalCloseBtn" aria-label="Close modal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <form id="newTaskForm">
        <div class="form-group">
          <label class="form-label" for="taskText">Task Description</label>
          <input type="text" class="form-input" id="taskText" placeholder="What needs doing today?" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="taskCategory">Category</label>
          <select class="form-select" id="taskCategory">
            <option value="work">Main Squeeze (Work)</option>
            <option value="personal">Zesty Life (Personal)</option>
            <option value="fun">Sweet Treats (Fun)</option>
            <option value="errands">Errands</option>
            <option value="health">Health & Body</option>
          </select>
        </div>
        <button type="submit" class="form-submit-btn">Add to Today's List</button>
      </form>
    </div>
  </div>

  <script type="module" src="./src/tasks.js"></script>
</body>
</html>
